$terminal = uwsm app -- alacritty
$filemgr = uwsm app -- nautilus --new-window
$scriptsDir = /home/kalpakavindu/.config/hypr/scripts
$finder = /home/kalpakavindu/.config/wofi/launch.sh

$mainMod = SUPER

bind = $mainMod, F11, fullscreen
bind = $mainMod, Q, killactive
bind = $mainMod, O, togglefloating
bind = $mainMod, M, exec, uwsm stop
bind = $mainMod, F, exec, $finder -t

bind = $mainMod, T, exec, $terminal
bind = $mainMod, E, exec, $filemgr
bind = $mainMod, N, exec, swaync-client -t -sw

# Clipboard
bind = $mainMod, V, exec, cliphist list | $finder -dm | cliphist decode | wl-copy

# -------- Workspace Bindings --------

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, TAB, workspace, previous

bind = $mainMod CTRL, 1, movetoworkspace, 1
bind = $mainMod CTRL, 2, movetoworkspace, 2
bind = $mainMod CTRL, 3, movetoworkspace, 3
bind = $mainMod CTRL, 4, movetoworkspace, 4
bind = $mainMod CTRL, 5, movetoworkspace, 5
bind = $mainMod CTRL, 6, movetoworkspace, 6
bind = $mainMod CTRL, 7, movetoworkspace, 7
bind = $mainMod CTRL, 8, movetoworkspace, 8
bind = $mainMod CTRL, 9, movetoworkspace, 9
bind = $mainMod CTRL, 0, movetoworkspace, 10

bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Scroll through workspaces
# bind = $mainMod, mouse_down, workspace, e+1
# bind = $mainMod, mouse_up, workspace, e-1


# -------- Volume and Media Control --------
bind = , XF86AudioRaiseVolume, exec, $scriptsDir/volume.sh --inc 
bind = , XF86AudioLowerVolume, exec, $scriptsDir/volume.sh --dec
# bind = , XF86AudioMicMute, exec, $scriptsDir/volume.sh --toggle-mic
bind = , XF86AudioMute, exec, $scriptsDir/volume.sh --toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

bindl = , XF86MonBrightnessUp, exec, $scriptsDir/backlight.sh --inc
bindl = , XF86MonBrightnessDown, exec, $scriptsDir/backlight.sh --dec

# -------- Window Control --------
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod ALT, left, swapwindow, l
bind = $mainMod ALT, right, swapwindow, r
bind = $mainMod ALT, up, swapwindow, u
bind = $mainMod ALT, down, swapwindow, d                                  

# -------- Eww Bar --------
bind = $mainMod SHIFT, B, exec, ~/.config/eww/scripts/launch.sh --launch-bar
bind = $mainMod, B, exec, ~/.config/eww/scripts/launch.sh --toggle-bar
