general {
    ignore_empty_input = true
}

background {
    monitor =
    path = $HOME/.config/hypr/res/backgrounds/anime.girl.with.blue.eyes.1920x1080-blurred.png
}

input-field {
    monitor =
    size = 200, 40
    outline_thickness = 2
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = rgba(abc7ffff)
    inner_color = rgba(e2e2e920)
    font_color = rgba(abc7ffff)
    fade_on_empty = true
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = Enter password # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = 20 # -1 means complete rounding (circle/oval)
    check_color = rgba(94b8ffff)
    fail_color = rgba(fda59bff) # if authentication failed, changes outer_color and fail message color
    fail_text = $FAIL ($ATTEMPTS) # can be set to empty
    fail_transition = 300 # transition time in ms between normal outer_color and fail_color
    capslock_color = rgba(ffca86e1)
    numlock_color = rgba(ffca86e1)
    bothlock_color = rgba(ffca86e1) # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below
    position = 0, -20
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 20
    shadow_color = rgba(000000ff)
    shadow_boost = 1.6
}

label {
    monitor =
    #clock
    text = cmd[update:1000] echo "$TIME"
    color = rgba(e2e2e9ff)
    font_size = 55
    font_family = Ubuntu Nerd Font Bold
    position = -100, 70
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    text = $USER
    color = rgba(e2e2e9aa)
    font_size = 16
    font_family = Ubuntu Nerd Font
    position = -100, 160
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

image {
    monitor =
    path = $HOME/.config/hypr/res/profile.pic.png
    size = 128 # lesser side if not 1:1 ratio
    rounding = -1 # negative values mean circle
    border_size = 2
    border_color = rgba(abc7ffff)
    rotate = 0 # degrees, counter-clockwise
    reload_time = -1 # seconds between reloading, 0 to reload with SIGUSR2
#    reload_cmd =  # command to get new path. if empty, old path will be used. don't run "follow" commands like tail -F
    position = 0, 100
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 20
    shadow_color = rgba(000000ff)
    shadow_boost = 1.6
}