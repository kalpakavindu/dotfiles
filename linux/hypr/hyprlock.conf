general {
    ignore_empty_input = true
    screencopy_mode = 0
    fail_timeout = 2000
}

auth {
    pam:enabled = true
    pam:module = hyprlock
}

animations{
    enabled = true
}

background {
    monitor =
    path = $HOME/Source/dotfiles/assets/wallpapers/anime-girl-with-blue-eyes-1920x1080-blur.png
}

input-field {
    monitor =
    size = 250, 40
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(2BA6C5ff)
    inner_color = rgba(1C658D40)
    font_size = 12
    font_color = rgba(2BA6C5ff)
    fade_on_empty = false
    # fade_timeout = 5000
    placeholder_text = Input Password
    hide_input = false
    rounding = 10
    check_color = rgba(B36E8FFF)
    fail_color = rgba(C54764FF)
    fail_text = $FAIL ($ATTEMPTS)
    fail_transition = 300
    capslock_color = rgba(EF9872FF)
    numlock_color = rgba(B36E8FFF)
    bothlock_color = rgba(C54764FF)
    invert_numlock = false
    swap_font_color = false
    position = 0, -100
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 20
    shadow_color = rgba(000000ff)
    shadow_boost = 1.6
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$TIME12"
    color = rgba(e2e2e9ff)
    font_size = 55
    font_family = Ubuntu Nerd Font Bold
    position = -100, 70
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    text = $USER
    color = rgba(e2e2e9aa)
    font_size = 16
    font_family = Ubuntu Nerd Font
    position = -100, 160
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    text = cmd[update:250] bash $HOME/Source/dotfiles/linux/hypr/scripts/capsNum.sh --txt
    # color = rgba(e2e2e9ff)
    font_size = 12
    font_family = Ubuntu Nerd Font
    halign = center
    valign = center
    position = 0, -50
    shadow_passes = 5
    shadow_size = 10
}

image {
    monitor =
    path = $HOME/Source/dotfiles/assets/avatar/lockscreen.png
    size = 160
    rounding = -1 # neg = circle
    border_size = 10
    border_color = rgba(2BA6C5ff)
    rotate = 0 # degrees, counter-clockwise
    reload_time = -1 # seconds between reloading, 0 to reload with SIGUSR2
#    reload_cmd =  # command to get new path. if empty, old path will be used. don't run "follow" commands like tail -F
    position = 0, 100
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 20
    shadow_color = rgba(000000ff)
    shadow_boost = 1.6
}
